[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "code-harness"
version = "0.1.0"
description = "A local-first terminal coding-agent harness"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "litellm==1.101.0",
    "pydantic==2.13.5",
    "python-dotenv==1.2.3",
    "python-frontmatter==1.3.0",
    "rich==15.0.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.8",
]

[project.scripts]
code-harness = "code_harness.main:cli"

[tool.setuptools]
packages = [
    "code_harness",
    "code_harness.core",
    "code_harness.cron_scheduler",
    "code_harness.events",
    "code_harness.goals",
    "code_harness.mcp",
    "code_harness.memory",
    "code_harness.team",
    "code_harness.tools",
]
package-dir = {code_harness = "."}
include-package-data = true

[tool.setuptools.package-data]
code_harness = ["py.typed", "settings.json", "skills/*/SKILL.md"]

[tool.ruff]
target-version = "py312"
line-length = 88
force-exclude = true
extend-exclude = [".worktrees"]

[tool.ruff.lint]
select = [
    "B",
    "C4",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "PIE",
    "RUF",
    "SIM",
    "UP",
]
# Tool metadata is intentionally declared as mutable class-level configuration.
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
# This test installs a lightweight litellm stub before importing the loop.
"tests/test_loop_refactor.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = [".."]

[tool.coverage.run]
branch = true
source = ["code_harness"]
omit = ["code_harness/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70
