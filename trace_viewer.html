<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Code Harness Trace Viewer</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fb;
      --panel: #ffffff;
      --text: #172033;
      --muted: #687386;
      --line: #dce2ea;
      --code: #101828;
      --system: #8a3ffc;
      --user: #0072ce;
      --assistant: #198754;
      --tool: #b7791f;
      --unknown: #667085;
      --error: #c2410c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.45;
    }

    header {
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      padding: 20px 28px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    h1 {
      font-size: 22px;
      margin: 0 0 12px;
      letter-spacing: 0;
    }

    .controls {
      align-items: end;
      display: flex;
      flex-wrap: wrap;
      gap: 12px 20px;
    }

    .control {
      display: grid;
      gap: 4px;
    }

    .control label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
      text-transform: uppercase;
    }

    input[type="file"],
    select {
      display: block;
      max-width: 100%;
    }

    button {
      background: var(--text);
      border: 0;
      border-radius: 6px;
      color: white;
      cursor: pointer;
      font: inherit;
      font-weight: 650;
      padding: 7px 12px;
    }

    .hint,
    .load-status {
      color: var(--muted);
      font-size: 13px;
      margin: 8px 0 0;
    }

    .load-status.error {
      color: var(--error);
    }

    [hidden] {
      display: none !important;
    }

    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 24px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat,
    .message {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .stat {
      padding: 12px 14px;
    }

    .stat .label {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
    }

    .stat .value {
      font-size: 16px;
      font-weight: 650;
      word-break: break-word;
    }

    .message {
      margin-bottom: 14px;
      overflow: hidden;
    }

    .timeline {
      border-left: 3px solid var(--line);
      margin-left: 10px;
      padding-left: 18px;
    }

    .timeline .message {
      position: relative;
    }

    .timeline .message::before {
      background: var(--panel);
      border: 3px solid var(--unknown);
      border-radius: 50%;
      content: "";
      height: 12px;
      left: -27px;
      position: absolute;
      top: 15px;
      width: 12px;
    }

    .timeline .timeline-goal::before { border-color: var(--system); }
    .timeline .timeline-message::before { border-color: var(--user); }
    .timeline .timeline-run::before { border-color: var(--assistant); }

    .outcome {
      background: #eefbf3;
      border-color: #86d5a5;
    }

    .outcome.error-outcome {
      background: #fff6ed;
      border-color: #f5a97f;
    }

    .message-header {
      align-items: center;
      border-bottom: 1px solid var(--line);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: space-between;
      padding: 10px 14px;
    }

    .message-title {
      align-items: center;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-width: 0;
    }

    .index {
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
    }

    .role {
      border-radius: 999px;
      color: white;
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      padding: 3px 9px;
      text-transform: uppercase;
    }

    .role-system { background: var(--system); }
    .role-user { background: var(--user); }
    .role-assistant { background: var(--assistant); }
    .role-tool { background: var(--tool); }
    .role-unknown { background: var(--unknown); }

    .meta {
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .content {
      padding: 14px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .empty {
      color: var(--muted);
      font-style: italic;
    }

    .tool-calls,
    .nested-llm-calls,
    details {
      margin: 0 14px 14px;
    }

    .tool-call,
    .nested-llm-call {
      background: #f3f5f8;
      border: 1px solid var(--line);
      border-radius: 6px;
      margin-top: 8px;
      padding: 10px;
    }

    pre {
      background: var(--code);
      border-radius: 6px;
      color: #eef4ff;
      margin: 8px 0 0;
      overflow: auto;
      padding: 10px;
      white-space: pre-wrap;
    }

    summary {
      color: var(--muted);
      cursor: pointer;
      font-weight: 650;
      user-select: none;
    }

    .error {
      color: var(--error);
      font-weight: 700;
    }

    .placeholder {
      color: var(--muted);
      padding: 40px 0;
      text-align: center;
    }

    .section-title {
      font-size: 18px;
      margin: 22px 0 10px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Code Harness Trace Viewer</h1>
    <div class="controls">
      <div class="control">
        <label for="fileInput">Trace files</label>
        <input id="fileInput" type="file" multiple accept="application/json,application/x-ndjson,.json,.jsonl">
      </div>
      <div class="control">
        <label for="folderInput">Entire traces folder</label>
        <input id="folderInput" type="file" multiple webkitdirectory directory accept="application/json,application/x-ndjson,.json,.jsonl">
      </div>
      <div id="goalPicker" class="control" hidden>
        <label for="goalSelect">Goal</label>
        <select id="goalSelect"></select>
      </div>
      <button id="demoButton" type="button">Load demo</button>
    </div>
    <p class="hint">For a unified timeline, choose the entire <code>traces</code> folder or select a goal JSONL together with its trace JSON files.</p>
    <p id="loadStatus" class="load-status"></p>
  </header>

  <main>
    <section id="summary" class="summary"></section>
    <h2 id="primaryTitle" class="section-title">Messages</h2>
    <section id="messages">
      <div class="placeholder">Choose a trace JSON or JSONL file from <code>code_harness/traces/</code>.</div>
    </section>
    <h2 id="nestedTitle" class="section-title">Nested LLM Calls</h2>
    <section id="nestedLlmCalls">
      <div class="placeholder">Nested LLM calls will appear here when present in the trace.</div>
    </section>
  </main>

  <script>
    const fileInput = document.getElementById("fileInput");
    const folderInput = document.getElementById("folderInput");
    const goalPickerEl = document.getElementById("goalPicker");
    const goalSelectEl = document.getElementById("goalSelect");
    const demoButton = document.getElementById("demoButton");
    const loadStatusEl = document.getElementById("loadStatus");
    const summaryEl = document.getElementById("summary");
    const messagesEl = document.getElementById("messages");
    const nestedLlmCallsEl = document.getElementById("nestedLlmCalls");
    const primaryTitleEl = document.getElementById("primaryTitle");
    const nestedTitleEl = document.getElementById("nestedTitle");
    let loadedEntries = [];

    fileInput.addEventListener("change", loadSelectedFiles);
    folderInput.addEventListener("change", loadSelectedFiles);
    goalSelectEl.addEventListener("change", renderSelectedGoal);
    demoButton.addEventListener("click", loadDemo);

    function loadDemo() {
      const goalId = "goal_demo";
      const conversationId = "conv_demo";
      const goalEvents = [
        { stage: "goal_set", timestamp: "2026-09-14T10:00:00-04:00", goal_id: goalId, conversation_id: conversationId, details: { condition: "pytest exits with code 0" } },
        { stage: "worker_started", timestamp: "2026-09-14T10:00:01-04:00", goal_id: goalId, conversation_id: conversationId, event_id: "event_user_demo", run_id: "run_user_demo", details: { event_type: "user", worker_model: "openrouter/example/model" } },
        { stage: "worker_deferred", timestamp: "2026-09-14T10:00:04-04:00", goal_id: goalId, conversation_id: conversationId, event_id: "event_user_demo", run_id: "run_user_demo", background_task_id: "bg_0001", details: { tool: "bash", arguments: { command: "python3 -m pytest -q" } } },
        { stage: "background_completed", timestamp: "2026-09-14T10:00:07-04:00", goal_id: goalId, conversation_id: conversationId, event_id: "event_user_demo", run_id: "run_user_demo", background_task_id: "bg_0001", details: { status: "completed", command: "python3 -m pytest -q", exit_code: 0 } },
        { stage: "worker_started", timestamp: "2026-09-14T10:00:08-04:00", goal_id: goalId, conversation_id: conversationId, event_id: "event_background_demo", run_id: "run_background_demo", details: { event_type: "background_task", worker_model: "openrouter/example/model" } },
        { stage: "evaluation_completed", timestamp: "2026-09-14T10:00:11-04:00", goal_id: goalId, conversation_id: conversationId, event_id: "event_background_demo", run_id: "run_background_demo", details: { action: "allow", reason: "The test command exited with code 0 and all 201 tests passed.", ok: true, impossible: false } },
        { stage: "goal_completed", timestamp: "2026-09-14T10:00:12-04:00", goal_id: goalId, conversation_id: conversationId, event_id: "event_background_demo", run_id: "run_background_demo", details: { reason: "The test command exited with code 0 and all 201 tests passed." } },
      ];
      const userTrace = {
        run_id: "run_user_demo",
        trace_type: "event_user",
        conversation_id: conversationId,
        started_at: "2026-09-14T10:00:01-04:00",
        ended_at: "2026-09-14T10:00:05-04:00",
        user_input: "Run the test suite and verify that it passes.",
        messages: [
          { role: "user", content: "Run the test suite and verify that it passes.", created_at: "2026-09-14T14:00:01Z", estimated_tokens: 12 },
          { role: "assistant", content: { content: "I’ll run the complete test suite and report concrete results.", tool_calls: [{ id: "call_demo", type: "function", function: { name: "bash", arguments: '{"command":"python3 -m pytest -q","run_in_background":true}' } }] }, created_at: "2026-09-14T14:00:03Z", estimated_tokens: 42 },
          { role: "tool", content: { content: "Started background task bg_0001" }, metadata: { tool_call_id: "call_demo" }, created_at: "2026-09-14T14:00:04Z", estimated_tokens: 8 },
        ],
        nested_llm_calls: [],
      };
      const backgroundTrace = {
        run_id: "run_background_demo",
        trace_type: "event_background_task",
        conversation_id: conversationId,
        started_at: "2026-09-14T10:00:08-04:00",
        ended_at: "2026-09-14T10:00:12-04:00",
        user_input: "Background task bg_0001 completed: 201 tests passed.",
        messages: [
          { role: "user", content: "Background task bg_0001 completed with exit code 0: 201 tests passed.", created_at: "2026-09-14T14:00:08Z", estimated_tokens: 17 },
          { role: "assistant", content: { content: "All 201 tests passed. The goal is satisfied.", tool_calls: null }, created_at: "2026-09-14T14:00:10Z", estimated_tokens: 14 },
        ],
        nested_llm_calls: [],
      };

      loadedEntries = [
        { fileName: "goals/goal_demo.jsonl", data: { trace_type: "jsonl", events: goalEvents } },
        { fileName: "event_user_demo.json", data: userTrace },
        { fileName: "event_background_demo.json", data: backgroundTrace },
      ];
      populateGoalPicker(getGoalEntries(loadedEntries));
      renderSelectedGoal();
      setLoadStatus("Demo loaded: 3 correlated trace files.");
    }

    async function loadSelectedFiles(event) {
      const files = Array.from(event.target.files || []).filter((file) =>
        /\.(?:json|jsonl)$/i.test(file.name)
      );
      if (!files.length) return;

      const results = await Promise.all(files.map(async (file) => {
        const fileName = file.webkitRelativePath || file.name;
        try {
          return {
            data: parseTraceText(await file.text(), fileName),
            fileName,
          };
        } catch (error) {
          return { error, fileName };
        }
      }));

      loadedEntries = results.filter((result) => !result.error);
      const failures = results.filter((result) => result.error);

      if (!loadedEntries.length) {
        goalPickerEl.hidden = true;
        summaryEl.innerHTML = "";
        messagesEl.innerHTML = `<div class="placeholder error">Could not load traces: ${escapeHtml(failures[0].error.message)}</div>`;
        nestedLlmCallsEl.innerHTML = "";
        setLoadStatus(`${failures.length} file(s) could not be parsed.`, true);
        return;
      }

      const goalEntries = getGoalEntries(loadedEntries);
      populateGoalPicker(goalEntries);
      if (goalEntries.length) {
        renderSelectedGoal();
      } else {
        const entry = loadedEntries[0];
        renderTrace(entry.data, entry.fileName);
      }

      const status = `${loadedEntries.length} trace file(s) loaded` + (
        failures.length ? `; ${failures.length} skipped because they were invalid.` : "."
      );
      setLoadStatus(status, failures.length > 0);
    }

    function setLoadStatus(message, isError = false) {
      loadStatusEl.textContent = message;
      loadStatusEl.classList.toggle("error", isError);
    }

    function getGoalEntries(entries) {
      return entries.filter((entry) =>
        entry.data && Array.isArray(entry.data.events) && entry.data.events.some(
          (event) => event && event.goal_id
        )
      );
    }

    function populateGoalPicker(goalEntries) {
      goalSelectEl.innerHTML = "";
      goalPickerEl.hidden = goalEntries.length === 0;
      const sorted = [...goalEntries].sort((left, right) =>
        timestampValue(right.data.events[0] && right.data.events[0].timestamp)
        - timestampValue(left.data.events[0] && left.data.events[0].timestamp)
      );
      for (const entry of sorted) {
        const first = entry.data.events[0] || {};
        const goalSet = entry.data.events.find((event) => event.stage === "goal_set");
        const condition = goalSet && goalSet.details && goalSet.details.condition;
        const option = document.createElement("option");
        option.value = first.goal_id || entry.fileName;
        option.textContent = condition
          ? `${condition} (${option.value})`
          : option.value;
        option.dataset.fileName = entry.fileName;
        goalSelectEl.appendChild(option);
      }
    }

    function renderSelectedGoal() {
      const goalEntry = getGoalEntries(loadedEntries).find((entry) => {
        const first = entry.data.events[0] || {};
        return (first.goal_id || entry.fileName) === goalSelectEl.value;
      });
      if (goalEntry) renderUnifiedGoal(goalEntry, loadedEntries);
    }

    function parseTraceText(text, fileName = "") {
      const withoutBom = text.replace(/^\uFEFF/, "");
      const trimmed = withoutBom.trim();
      if (!trimmed) throw new Error("The selected file is empty.");

      try {
        return JSON.parse(trimmed);
      } catch (jsonError) {
        const events = [];
        const invalidLines = [];

        withoutBom.split(/\r?\n/).forEach((line, index) => {
          if (!line.trim()) return;
          try {
            events.push(JSON.parse(line));
          } catch (error) {
            invalidLines.push(`${index + 1} (${error.message})`);
          }
        });

        if (invalidLines.length) {
          throw new Error(`Invalid JSONL at line ${invalidLines.join(", line ")}`);
        }
        if (!events.length) throw jsonError;
        return { trace_type: "jsonl", events, source_file: fileName };
      }
    }

    function buildUnifiedGoalTimeline(goalEntry, entries) {
      const events = goalEntry.data.events;
      const first = events[0] || {};
      const goalId = first.goal_id;
      const conversationId = first.conversation_id;
      const referencedRunIds = new Set(
        events.map((event) => event && event.run_id).filter(Boolean)
      );
      const traces = entries.filter((entry) => {
        const trace = entry.data;
        return trace
          && !Array.isArray(trace.events)
          && Array.isArray(trace.messages)
          && referencedRunIds.has(trace.run_id)
          && (!conversationId || trace.conversation_id === conversationId);
      });
      const matchedRunIds = new Set(traces.map((entry) => entry.data.run_id));
      const items = [];

      events.forEach((event, sourceIndex) => items.push({
        data: event,
        kind: "goal",
        sourceIndex,
        timestamp: event && event.timestamp,
      }));

      traces.forEach((entry) => {
        const trace = entry.data;
        items.push({
          data: trace,
          fileName: entry.fileName,
          kind: "run_start",
          timestamp: trace.started_at,
        });
        trace.messages.forEach((message, sourceIndex) => items.push({
          data: message,
          fileName: entry.fileName,
          kind: "message",
          runId: trace.run_id,
          sourceIndex,
          timestamp: message && message.created_at || trace.started_at,
          traceType: trace.trace_type,
        }));
        (trace.nested_llm_calls || []).forEach((call, sourceIndex) => items.push({
          data: call,
          fileName: entry.fileName,
          kind: "nested_llm",
          runId: trace.run_id,
          sourceIndex,
          timestamp: call && call.started_at || trace.started_at,
          traceType: trace.trace_type,
        }));
        items.push({
          data: trace,
          fileName: entry.fileName,
          kind: "run_end",
          timestamp: trace.ended_at,
        });
      });

      const kindOrder = {
        goal: 0,
        run_start: 1,
        message: 2,
        nested_llm: 3,
        run_end: 4,
      };
      items.sort((left, right) => {
        const difference = timestampValue(left.timestamp) - timestampValue(right.timestamp);
        return difference || kindOrder[left.kind] - kindOrder[right.kind];
      });

      return {
        conversationId,
        events,
        goalId,
        goalFileName: goalEntry.fileName,
        items,
        matchedRunIds,
        referencedRunIds,
        traces,
      };
    }

    function timestampValue(value) {
      const parsed = Date.parse(value || "");
      return Number.isFinite(parsed) ? parsed : Number.MAX_SAFE_INTEGER;
    }

    function goalOutcome(events) {
      const terminalStages = new Set([
        "goal_completed",
        "goal_impossible",
        "goal_paused",
        "goal_cleared",
      ]);
      const terminal = [...events].reverse().find((event) =>
        terminalStages.has(event && event.stage)
      );
      if (terminal) {
        return {
          label: terminal.stage.replace(/^goal_/, "").replaceAll("_", " "),
          reason: terminal.details && terminal.details.reason || "",
          stage: terminal.stage,
        };
      }
      const evaluation = [...events].reverse().find((event) =>
        event && event.stage === "evaluation_completed"
      );
      if (evaluation && evaluation.details && evaluation.details.action === "error") {
        return {
          label: "evaluation error",
          reason: evaluation.details.reason || "",
          stage: "evaluation_error",
        };
      }
      return {
        label: "active",
        reason: evaluation && evaluation.details && evaluation.details.reason || "",
        stage: "active",
      };
    }

    function renderUnifiedGoal(goalEntry, entries) {
      const timeline = buildUnifiedGoalTimeline(goalEntry, entries);
      const events = timeline.events;
      const first = events[0] || {};
      const last = events[events.length - 1] || {};
      const goalSet = events.find((event) => event && event.stage === "goal_set");
      const condition = goalSet && goalSet.details && goalSet.details.condition || "unknown";
      const outcome = goalOutcome(events);
      const messages = timeline.traces.flatMap((entry) => entry.data.messages || []);
      const toolCalls = messages.reduce(
        (total, message) => total + getToolCalls(message).length,
        0,
      );
      const missingRuns = [...timeline.referencedRunIds].filter(
        (runId) => !timeline.matchedRunIds.has(runId)
      );

      primaryTitleEl.textContent = "Unified Goal Timeline";
      nestedTitleEl.hidden = true;
      nestedLlmCallsEl.hidden = true;
      messagesEl.className = "timeline";
      messagesEl.innerHTML = "";

      const stats = [
        ["Goal", timeline.goalId || "unknown"],
        ["Condition", condition],
        ["Outcome", outcome.label],
        ["Result", outcome.reason || "No final reason recorded"],
        ["Started", first.timestamp || "unknown"],
        ["Ended", last.timestamp || "unknown"],
        ["Runs Loaded", `${timeline.matchedRunIds.size} / ${timeline.referencedRunIds.size}`],
        ["Messages", String(messages.length)],
        ["Tool Calls", String(toolCalls)],
        ["Goal Events", String(events.length)],
      ];
      summaryEl.innerHTML = stats.map(([label, value]) => `
        <div class="stat">
          <div class="label">${escapeHtml(label)}</div>
          <div class="value">${escapeHtml(value)}</div>
        </div>
      `).join("");

      const outcomeEl = document.createElement("article");
      const errorOutcome = /error|impossible|paused/.test(outcome.stage);
      outcomeEl.className = `message outcome ${errorOutcome ? "error-outcome" : ""}`;
      outcomeEl.innerHTML = `
        <div class="message-header">
          <div class="message-title">
            <span class="role role-${errorOutcome ? "unknown" : "assistant"}">${escapeHtml(outcome.label)}</span>
            <strong>Goal result</strong>
          </div>
        </div>
        <div class="content">${escapeHtml(outcome.reason || "The goal has no terminal result yet.")}</div>
      `;
      messagesEl.appendChild(outcomeEl);

      if (missingRuns.length) {
        const warning = document.createElement("div");
        warning.className = "message error-outcome";
        warning.innerHTML = `
          <div class="content error">Missing ${missingRuns.length} referenced run trace(s). Select the entire traces folder for the complete timeline.</div>
          <details><summary>Missing run IDs</summary><pre>${escapeHtml(missingRuns.join("\n"))}</pre></details>
        `;
        messagesEl.appendChild(warning);
      }

      timeline.items.forEach((item, index) => {
        let element;
        if (item.kind === "goal") {
          element = renderEvent(item.data, index);
          element.classList.add("timeline-goal");
        } else if (item.kind === "message") {
          const context = `${item.traceType || "run"}  run: ${item.runId}  file: ${item.fileName}`;
          element = renderMessage(item.data, index, context);
          element.classList.add("timeline-message");
        } else if (item.kind === "nested_llm") {
          const context = `run: ${item.runId}  file: ${item.fileName}`;
          element = renderNestedLlmCall(item.data, index, context);
          element.classList.add("timeline-message");
        } else {
          element = renderRunBoundary(item, index);
        }
        messagesEl.appendChild(element);
      });
    }

    function renderRunBoundary(item, index) {
      const trace = item.data;
      const isStart = item.kind === "run_start";
      const article = document.createElement("article");
      article.className = "message timeline-run";
      article.innerHTML = `
        <div class="message-header">
          <div class="message-title">
            <span class="index">#${index}</span>
            <span class="role role-assistant">${isStart ? "run started" : "run ended"}</span>
            <span class="meta">${escapeHtml(item.timestamp || "unknown time")}</span>
          </div>
        </div>
        <div class="content">
          <strong>${escapeHtml(trace.trace_type || "agent")}</strong> · ${escapeHtml(trace.run_id || "unknown run")}
          ${isStart && trace.user_input ? `<br>${escapeHtml(trace.user_input)}` : ""}
          <div class="meta">${escapeHtml(item.fileName)}</div>
        </div>
      `;
      return article;
    }

    function renderTrace(trace, fileName) {
      if (trace && Array.isArray(trace.events)) {
        renderEventTrace(trace.events, fileName);
        return;
      }

      primaryTitleEl.textContent = "Messages";
      messagesEl.className = "";
      nestedTitleEl.hidden = false;
      nestedLlmCallsEl.hidden = false;
      const messages = Array.isArray(trace.messages)
        ? trace.messages
        : Array.isArray(trace)
          ? trace
          : [];
      const nestedLlmCalls = Array.isArray(trace.nested_llm_calls)
        ? trace.nested_llm_calls
        : [];

      renderSummary(trace, messages, nestedLlmCalls, fileName);
      messagesEl.innerHTML = "";
      nestedLlmCallsEl.innerHTML = "";

      if (!messages.length) {
        messagesEl.innerHTML = '<div class="placeholder">No messages found in this trace.</div>';
      } else {
        messages.forEach((message, index) => {
          messagesEl.appendChild(renderMessage(message, index));
        });
      }

      if (!nestedLlmCalls.length) {
        nestedLlmCallsEl.innerHTML = '<div class="placeholder">No nested LLM calls found in this trace.</div>';
      } else {
        nestedLlmCalls.forEach((call, index) => {
          nestedLlmCallsEl.appendChild(renderNestedLlmCall(call, index));
        });
      }
    }

    function renderEventTrace(events, fileName) {
      primaryTitleEl.textContent = "Goal Events";
      nestedTitleEl.hidden = true;
      nestedLlmCallsEl.hidden = true;
      messagesEl.innerHTML = "";
      messagesEl.className = "";

      const first = events[0] || {};
      const last = events[events.length - 1] || {};
      const stages = {};
      let errors = 0;
      for (const event of events) {
        const stage = String(event && event.stage || "unknown");
        stages[stage] = (stages[stage] || 0) + 1;
        if (/error|fail/i.test(stage) || event && event.error || containsError(compactJson(event && event.details))) {
          errors += 1;
        }
      }

      const stageText = Object.entries(stages)
        .map(([stage, count]) => `${stage}: ${count}`)
        .join(" | ") || "none";
      const stats = [
        ["File", fileName],
        ["Goal", first.goal_id || "unknown"],
        ["Conversation", first.conversation_id || "unknown"],
        ["Started", first.timestamp || "unknown"],
        ["Ended", last.timestamp || "unknown"],
        ["Events", String(events.length)],
        ["Stages", stageText],
        ["Errors", String(errors)],
      ];
      summaryEl.innerHTML = stats.map(([label, value]) => `
        <div class="stat">
          <div class="label">${escapeHtml(label)}</div>
          <div class="value">${escapeHtml(value)}</div>
        </div>
      `).join("");

      if (!events.length) {
        messagesEl.innerHTML = '<div class="placeholder">No events found in this trace.</div>';
        return;
      }
      events.forEach((event, index) => messagesEl.appendChild(renderEvent(event, index)));
    }

    function renderEvent(event, index) {
      const article = document.createElement("article");
      article.className = "message";
      const stage = String(event && event.stage || "unknown");
      const details = event && event.details;
      const metadata = [
        event && event.timestamp,
        event && event.run_id ? `run: ${event.run_id}` : "",
        event && event.event_id ? `event: ${event.event_id}` : "",
        event && event.background_task_id ? `task: ${event.background_task_id}` : "",
      ].filter(Boolean).join("  ");
      const errorLike = /error|fail/i.test(stage) || containsError(compactJson(details));

      article.innerHTML = `
        <div class="message-header">
          <div class="message-title">
            <span class="index">#${index}</span>
            <span class="role role-${errorLike ? "unknown" : "assistant"}">${escapeHtml(stage)}</span>
            ${metadata ? `<span class="meta">${escapeHtml(metadata)}</span>` : ""}
          </div>
          ${errorLike ? '<span class="error">error-like event</span>' : ""}
        </div>
        <div class="content"><pre>${escapeHtml(formatJson(details === undefined ? {} : details))}</pre></div>
      `;

      const rawDetails = document.createElement("details");
      rawDetails.innerHTML = `
        <summary>Raw event JSON</summary>
        <pre>${escapeHtml(formatJson(event))}</pre>
      `;
      article.appendChild(rawDetails);
      return article;
    }

    function renderSummary(trace, messages, nestedLlmCalls, fileName) {
      const roleCounts = {};
      let toolCalls = 0;
      let errors = 0;
      let nestedErrors = 0;
      let messageTokens = 0;
      let nestedLlmMessageTokens = 0;

      for (const message of messages) {
        const role = String(message && message.role || "unknown");
        roleCounts[role] = (roleCounts[role] || 0) + 1;
        toolCalls += getToolCalls(message).length;
        if (message && (message.error || containsError(message.content))) errors += 1;
        messageTokens += getMessageTokenCount(message);
      }

      for (const call of nestedLlmCalls) {
        if (call && (call.status === "error" || call.error)) nestedErrors += 1;
        nestedLlmMessageTokens += getNestedLlmCallTokenCount(call);
      }

      const roleText = Object.entries(roleCounts)
        .map(([role, count]) => `${role}: ${count}`)
        .join(" | ") || "none";
      const totalTokens = messageTokens + nestedLlmMessageTokens;

      const stats = [
        ["File", fileName],
        ["Run", trace.run_id || "unknown"],
        ["Started", trace.started_at || "unknown"],
        ["Ended", trace.ended_at || "unknown"],
        ["Messages", String(messages.length)],
        ["Nested LLM Calls", String(nestedLlmCalls.length)],
        ["Message Tokens", formatNumber(messageTokens)],
        ["Nested LLM Message Tokens", formatNumber(nestedLlmMessageTokens)],
        ["Total Tokens", formatNumber(totalTokens)],
        ["Roles", roleText],
        ["Assistant Tool Calls", String(toolCalls)],
        ["Errors", String(errors + nestedErrors)],
      ];

      summaryEl.innerHTML = stats.map(([label, value]) => `
        <div class="stat">
          <div class="label">${escapeHtml(label)}</div>
          <div class="value">${escapeHtml(value)}</div>
        </div>
      `).join("");
    }

    function renderMessage(message, index, context = "") {
      const role = String(message && message.role || "unknown");
      const safeRole = ["system", "user", "assistant", "tool"].includes(role) ? role : "unknown";
      const article = document.createElement("article");
      article.className = "message";

      const toolCallIdValue = getToolCallId(message);
      const toolCallId = toolCallIdValue ? `tool_call_id: ${toolCallIdValue}` : "";
      const name = message && message.name ? `name: ${message.name}` : "";
      const meta = [toolCallId, name, context].filter(Boolean).join("  ");
      const content = getDisplayContent(message);
      const toolCalls = getToolCalls(message);
      const tokenCount = getMessageTokenCount(message);

      article.innerHTML = `
        <div class="message-header">
          <div class="message-title">
            <span class="index">#${index}</span>
            <span class="role role-${safeRole}">${escapeHtml(role)}</span>
            ${meta ? `<span class="meta">${escapeHtml(meta)}</span>` : ""}
          </div>
          <span class="meta">tokens: ${escapeHtml(formatNumber(tokenCount))}</span>
          ${containsError(content) ? '<span class="error">error-like content</span>' : ""}
        </div>
        <div class="content ${content ? "" : "empty"}">${escapeHtml(content || "(empty content)")}</div>
      `;

      if (toolCalls.length) {
        const calls = document.createElement("div");
        calls.className = "tool-calls";
        calls.innerHTML = `<summary>Assistant tool calls (${toolCalls.length})</summary>`;

        toolCalls.forEach((call, callIndex) => {
          const fn = call.function || {};
          const callEl = document.createElement("div");
          callEl.className = "tool-call";
          callEl.innerHTML = `
            <div class="meta">#${callIndex} id: ${escapeHtml(call.id || "unknown")} name: ${escapeHtml(fn.name || "unknown")}</div>
            <pre>${escapeHtml(formatJson(parseMaybeJson(fn.arguments)))}</pre>
          `;
          calls.appendChild(callEl);
        });
        article.appendChild(calls);
      }

      const details = document.createElement("details");
      details.innerHTML = `
        <summary>Raw message JSON</summary>
        <pre>${escapeHtml(formatJson(message))}</pre>
      `;
      article.appendChild(details);

      return article;
    }

    function renderNestedLlmCall(call, index, context = "") {
      const article = document.createElement("article");
      article.className = "message";
      const status = String(call && call.status || "unknown");
      const safeRole = status === "error" ? "unknown" : "assistant";
      const filePath = call && call.file_path ? `file: ${call.file_path}` : "";
      const model = call && call.model ? `model: ${call.model}` : "";
      const started = call && call.started_at ? `started: ${call.started_at}` : "";
      const ended = call && call.ended_at ? `ended: ${call.ended_at}` : "";
      const meta = [filePath, model, started, ended, context].filter(Boolean).join("  ");
      const response = call && call.response_content ? call.response_content : "";
      const error = call && call.error ? call.error : "";
      const tokenCount = getNestedLlmCallTokenCount(call);

      article.innerHTML = `
        <div class="message-header">
          <div class="message-title">
            <span class="index">#${index}</span>
            <span class="role role-${safeRole}">${escapeHtml(status)}</span>
            ${meta ? `<span class="meta">${escapeHtml(meta)}</span>` : ""}
          </div>
          <span class="meta">tokens: ${escapeHtml(formatNumber(tokenCount))}</span>
          ${error ? '<span class="error">error</span>' : ""}
        </div>
        <div class="content ${response || error ? "" : "empty"}">${escapeHtml(response || error || "(empty response)")}</div>
      `;

      const promptDetails = document.createElement("details");
      promptDetails.innerHTML = `
        <summary>Prompt messages</summary>
        <pre>${escapeHtml(formatJson(call && call.messages || []))}</pre>
      `;
      article.appendChild(promptDetails);

      const rawDetails = document.createElement("details");
      rawDetails.innerHTML = `
        <summary>Raw nested LLM call JSON</summary>
        <pre>${escapeHtml(formatJson(call))}</pre>
      `;
      article.appendChild(rawDetails);

      return article;
    }

    function getToolCalls(message) {
      if (!message) return [];
      if (Array.isArray(message.tool_calls)) return message.tool_calls;
      if (message.content && Array.isArray(message.content.tool_calls)) return message.content.tool_calls;
      if (message.llm_message && Array.isArray(message.llm_message.tool_calls)) return message.llm_message.tool_calls;
      return [];
    }

    function getToolCallId(message) {
      if (!message) return "";
      if (message.tool_call_id) return message.tool_call_id;
      if (message.metadata && message.metadata.tool_call_id) return message.metadata.tool_call_id;
      if (message.content && message.content.tool_call_id) return message.content.tool_call_id;
      if (message.llm_message && message.llm_message.tool_call_id) return message.llm_message.tool_call_id;
      return "";
    }

    function getMessageTokenCount(message) {
      if (!message) return 0;
      const estimated = asNumber(message.estimated_tokens);
      if (estimated !== null) return estimated;
      if (message.llm_message) return estimateTokens(message.llm_message);
      return estimateTokens({ role: message.role, content: message.content });
    }

    function getNestedLlmCallTokenCount(call) {
      if (!call) return 0;
      const usage = call.usage || call.response_usage;
      const usageTotal = usage ? asNumber(usage.total_tokens) : null;
      if (usageTotal !== null) return usageTotal;

      const messages = Array.isArray(call.messages) ? call.messages : [];
      const promptTokens = messages.reduce(
        (total, message) => total + getMessageTokenCount(message),
        0,
      );
      const responseTokens = call.response_content
        ? estimateTokens({ role: "assistant", content: call.response_content })
        : 0;

      return promptTokens + responseTokens;
    }

    function estimateTokens(value) {
      if (value === null || value === undefined) return 0;
      const text = typeof value === "string" ? value : compactJson(value);
      return Math.floor(text.length / 4);
    }

    function compactJson(value) {
      try {
        const json = JSON.stringify(value);
        return json === undefined ? String(value) : json;
      } catch {
        return String(value);
      }
    }

    function asNumber(value) {
      const number = Number(value);
      return Number.isFinite(number) ? number : null;
    }

    function formatNumber(value) {
      return Number(value || 0).toLocaleString("en-US");
    }

    function getDisplayContent(message) {
      if (!message) return "";
      const content = message.content;
      if (typeof content === "string") return content;

      if (content && typeof content === "object") {
        if (typeof content.content === "string") return content.content;
        if (content.content !== undefined && content.content !== null) return contentToText(content.content);
        if (Array.isArray(content.tool_calls) && content.tool_calls.length) return "(assistant requested tool call)";
      }

      if (message.llm_message && typeof message.llm_message.content === "string") {
        return message.llm_message.content;
      }
      if (getToolCalls(message).length) return "(assistant requested tool call)";
      return contentToText(content);
    }

    function contentToText(content) {
      if (content === null || content === undefined) return "";
      if (typeof content === "string") return content;
      return formatJson(content);
    }

    function containsError(value) {
      return typeof value === "string" && /error|failed|traceback|exception/i.test(value);
    }

    function parseMaybeJson(value) {
      if (typeof value !== "string") return value;
      try {
        return JSON.parse(value);
      } catch {
        return value;
      }
    }

    function formatJson(value) {
      try {
        return JSON.stringify(value, null, 2);
      } catch {
        return String(value);
      }
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
</html>
